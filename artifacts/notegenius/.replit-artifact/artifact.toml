kind = "mobile"
previewPath = "/"
title = "NoteGenius AI"
version = "1.0.0"
id = "artifacts/notegenius"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23211

[services.development]
run = "pnpm --filter @workspace/notegenius run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notegenius", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/notegenius", "run", "serve" ]

[services.env]
PORT = "23211"
BASE_PATH = "/"
