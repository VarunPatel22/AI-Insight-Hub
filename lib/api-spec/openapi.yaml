openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI processing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/process:
    post:
      operationId: processNotes
      tags: [ai]
      summary: Process notes with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessNotesBody"
      responses:
        "200":
          description: Processed notes result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessNotesResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/analyze-pyq:
    post:
      operationId: analyzePyq
      tags: [ai]
      summary: Analyze previous year question papers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzePyqBody"
      responses:
        "200":
          description: PYQ analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PYQAnalysisResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ProcessNotesBody:
      type: object
      required: [noteText]
      properties:
        noteText:
          type: string
        subject:
          type: string
          default: General
    TopicSummaryItem:
      type: object
      required: [title, summary, keyPoints, definitions, formulas]
      properties:
        title:
          type: string
        summary:
          type: string
        keyPoints:
          type: array
          items:
            type: string
        definitions:
          type: array
          items:
            type: string
        formulas:
          type: array
          items:
            type: string
    SummaryData:
      type: object
      required: [bullets, keywords, examNotes, simpleExplanation]
      properties:
        bullets:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        examNotes:
          type: string
        simpleExplanation:
          type: string
    MCQItem:
      type: object
      required: [question, options, correctIndex, explanation, difficulty]
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        explanation:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
    FlashcardItem:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string
    VivaItem:
      type: object
      required: [question, answer, level]
      properties:
        question:
          type: string
        answer:
          type: string
        level:
          type: string
          enum: [beginner, intermediate, advanced]
    ProcessNotesResult:
      type: object
      required: [title, summary, mcqs, flashcards, vivaQuestions, topics]
      properties:
        title:
          type: string
        summary:
          $ref: "#/components/schemas/SummaryData"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicSummaryItem"
        mcqs:
          type: array
          items:
            $ref: "#/components/schemas/MCQItem"
        flashcards:
          type: array
          items:
            $ref: "#/components/schemas/FlashcardItem"
        vivaQuestions:
          type: array
          items:
            $ref: "#/components/schemas/VivaItem"
    AnalyzePyqBody:
      type: object
      required: [paperText]
      properties:
        paperText:
          type: string
        subject:
          type: string
        fileName:
          type: string
    PYQQuestion:
      type: object
      required: [question, count, avgMarks, importance, topic]
      properties:
        question:
          type: string
        count:
          type: integer
        avgMarks:
          type: number
        importance:
          type: string
          enum: [very_important, high_probability, most_repeated, frequently_asked]
        topic:
          type: string
    PYQTopic:
      type: object
      required: [topic, repetitions, avgMarks, importance]
      properties:
        topic:
          type: string
        repetitions:
          type: integer
        avgMarks:
          type: number
        importance:
          type: string
    PYQTopQuestion:
      type: object
      required: [question, type, marks]
      properties:
        question:
          type: string
        type:
          type: string
          enum: [long, short, definition]
        marks:
          type: integer
    PYQAnalysisResult:
      type: object
      required: [repeatedQuestions, importantTopics, examPredictions, topQuestions]
      properties:
        repeatedQuestions:
          type: array
          items:
            $ref: "#/components/schemas/PYQQuestion"
        importantTopics:
          type: array
          items:
            $ref: "#/components/schemas/PYQTopic"
        examPredictions:
          type: array
          items:
            type: string
        topQuestions:
          type: array
          items:
            $ref: "#/components/schemas/PYQTopQuestion"
